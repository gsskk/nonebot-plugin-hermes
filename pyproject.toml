[project]
name = "nonebot-plugin-hermes"
version = "0.4.4"
description = "NoneBot plugin for Hermes Agent — multi-platform AI chatbot via Hermes API Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.50.2",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "fastmcp>=3.0,<4",
    "json5>=0.9.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # <0.16: uv.lock 不进 git,CI 每次重新解析;0.16 改了 lint 规则,
    # 无上界会让 CI 与本地 ruff 行为漂移。升级需连带过一遍新规则再抬上界。
    "ruff>=0.15,<0.16",
    "nonebot-adapter-onebot>=2.4.6",
]

[project.urls]
"Homepage" = "https://github.com/gsskk/nonebot-plugin-hermes"

[project.scripts]
hermes-install-skill = "hermes_install_skill:main"

[tool.nonebot]
plugins = ["nonebot_plugin_hermes"]

[tool.ruff]
line-length = 120
exclude = ["references", "dist", "build"]

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_hermes*"]

[tool.setuptools]
py-modules = ["hermes_install_skill"]

[tool.setuptools.package-data]
nonebot_plugin_hermes = ["skill/*.md"]
